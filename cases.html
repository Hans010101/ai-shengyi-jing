<!DOCTYPE html>
<html lang="zh-CN" data-title-en="Case Study Library | AI Business Insights" data-description-en="Browse every in-depth business case by category, with product, growth, economics, images, and videos.">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="按赛道分类浏览AI生意经全部中文案例详情">
  <title>案例详情库｜AI生意经</title>
  <link rel="canonical" href="https://ai-shengyi-jing.pages.dev/cases.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="案例详情库｜AI生意经">
  <meta property="og:description" content="按赛道、营收和更新时间检索全部 AI 与数字生意案例。">
  <meta property="og:url" content="https://ai-shengyi-jing.pages.dev/cases.html">
  <link rel="stylesheet" href="assets/cases.css">
</head>
<body>
  <a class="skip-link" href="#main-content" data-zh="跳到主要内容" data-en="Skip to main content">跳到主要内容</a>
  <header class="directory-header">
    <div class="directory-header-inner">
      <a class="directory-brand" href="index.html" data-zh="💡 AI生意经" data-en="💡 AI Business Insights">💡 AI生意经</a>
      <nav class="directory-nav" aria-label="主导航">
        <a href="index.html#projects" data-zh="精选案例" data-en="Featured"></a>
        <a class="active" href="cases.html" aria-current="page" data-zh="案例详情" data-en="Case Studies"></a>
        <a href="index.html#all-projects" data-zh="全量项目库" data-en="All Projects"></a>
        <a href="index.html#radar" data-zh="生意雷达" data-en="Business Radar"></a>
      </nav>
      <button type="button" class="language-toggle" data-language-toggle>EN</button>
    </div>
  </header>

  <main id="main-content">
    <section class="directory-hero">
      <div class="directory-container">
        <div class="directory-eyebrow" data-zh="AI 生意经 · 中文商业案例库" data-en="AI Business Insights · Global Case Library"></div>
        <h1><span data-zh="快速查阅每一个" data-en="Explore every business"></span><br><span data-zh="真实生意案例详情" data-en="through a complete case study"></span></h1>
        <p data-zh="按照现有项目赛道分类，直接进入完整中文商业拆解、增长逻辑、落地路径及原始图片与视频素材。" data-en="Browse by category and open a complete analysis of the product, economics, growth loop, launch path, and original visual material."></p>
        <label class="case-search" for="caseSearchInput">
          <span aria-hidden="true">⌕</span>
          <input id="caseSearchInput" type="search" aria-label="搜索案例" data-aria-zh="搜索案例" data-aria-en="Search case studies" placeholder="搜索案例名称、行业或商业关键词" data-placeholder-zh="搜索案例名称、行业或商业关键词" data-placeholder-en="Search by project, industry, or business model" autocomplete="off">
          <button id="caseSearchClear" type="button" aria-label="清空搜索" data-zh="清空" data-en="Clear"></button>
        </label>
        <div class="directory-stats">
          <strong id="caseTotalCount">—</strong>
          <span data-zh="篇完整案例详情，持续同步更新" data-en="complete case studies, continuously updated"></span>
        </div>
      </div>
    </section>

    <section class="directory-main" aria-labelledby="directoryTitle">
      <div class="directory-container">
        <div class="directory-section-head">
          <div>
            <h2 id="directoryTitle" data-zh="按分类浏览案例" data-en="Browse by category"></h2>
            <p id="caseResultSummary" data-zh="正在载入案例目录…" data-en="Loading the case directory…"></p>
          </div>
          <select id="caseSortSelect" aria-label="案例排序">
            <option value="latest" data-zh="最近更新" data-en="Latest updates"></option>
            <option value="revenue" data-zh="营收从高到低" data-en="Revenue: high to low"></option>
            <option value="name" data-zh="名称排序" data-en="Name"></option>
          </select>
        </div>

        <div class="case-category-bar" id="caseCategoryBar" aria-label="案例分类"></div>
        <div class="case-directory-grid" id="caseDirectoryGrid" aria-live="polite"></div>
        <div class="case-directory-empty" id="caseDirectoryEmpty" hidden>
          <div>🔎</div>
          <h3 data-zh="没有找到匹配案例" data-en="No matching case studies"></h3>
          <p data-zh="可以更换分类或缩短搜索关键词。" data-en="Try another category or a shorter search term."></p>
        </div>
        <nav class="case-pagination" id="casePagination" aria-label="案例分页"></nav>
      </div>
    </section>
  </main>

  <footer class="directory-footer">
    <a href="index.html" data-zh="💡 AI生意经" data-en="💡 AI Business Insights">💡 AI生意经</a>
    <p data-zh="原创中文商业拆解 · 数据仅供研究参考" data-en="Original business analysis · Data for research purposes"></p>
  </footer>

  <script src="assets/i18n.js"></script>
  <script src="assets/cases.js"></script>
</body>
</html>
