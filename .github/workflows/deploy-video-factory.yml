name: Deploy video factory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'video-factory/**'
      - '.github/workflows/deploy-video-factory.yml'

concurrency:
  group: deploy-video-factory
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video-factory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: video-factory/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply VIDEO_DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy catalog API and cloud control plane
        run: npx wrangler deploy --config wrangler.api.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Configure production secrets
        run: |
          node -e "const fs=require('node:fs');fs.writeFileSync('/tmp/video-factory-secrets.json',JSON.stringify({FACTORY_ADMIN_TOKEN:process.env.FACTORY_ADMIN_TOKEN,INTERNAL_RENDER_TOKEN:process.env.INTERNAL_RENDER_TOKEN,DEEPSEEK_API_KEY:process.env.DEEPSEEK_API_KEY}))"
          npx wrangler secret bulk /tmp/video-factory-secrets.json --config wrangler.api.jsonc
          rm -f /tmp/video-factory-secrets.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          FACTORY_ADMIN_TOKEN: ${{ secrets.VIDEO_FACTORY_ADMIN_TOKEN }}
          INTERNAL_RENDER_TOKEN: ${{ secrets.VIDEO_FACTORY_INTERNAL_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      - name: Deploy Worker and renderer container
        run: npx wrangler deploy --containers-rollout=immediate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
