name: Deploy video factory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'video-factory/**'
      - '.github/workflows/deploy-video-factory.yml'

concurrency:
  group: deploy-video-factory
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video-factory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: video-factory/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply VIDEO_DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker and renderer container
        run: npx wrangler deploy --containers-rollout=immediate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
