name: Deploy video factory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'video-factory/**'
      - '.github/workflows/deploy-video-factory.yml'

concurrency:
  group: deploy-video-factory
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video-factory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: video-factory/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply VIDEO_DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.VIDEO_FACTORY_CLOUDFLARE_API_TOKEN }}
      - name: Configure production secrets
        run: |
          node -e "const fs=require('node:fs');const secrets={FACTORY_ADMIN_TOKEN:process.env.FACTORY_ADMIN_TOKEN,INTERNAL_RENDER_TOKEN:process.env.INTERNAL_RENDER_TOKEN};if(process.env.DEEPSEEK_API_KEY)secrets.DEEPSEEK_API_KEY=process.env.DEEPSEEK_API_KEY;fs.writeFileSync('/tmp/video-factory-secrets.json',JSON.stringify(secrets))"
          npx wrangler secret bulk /tmp/video-factory-secrets.json --config wrangler.api.jsonc
          rm -f /tmp/video-factory-secrets.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.VIDEO_FACTORY_CLOUDFLARE_API_TOKEN }}
          FACTORY_ADMIN_TOKEN: ${{ secrets.VIDEO_FACTORY_ADMIN_TOKEN }}
          INTERNAL_RENDER_TOKEN: ${{ secrets.VIDEO_FACTORY_INTERNAL_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.VIDEO_FACTORY_DEEPSEEK_API_KEY }}
      - name: Deploy Worker and renderer container
        run: npx wrangler deploy --containers-rollout=immediate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.VIDEO_FACTORY_CLOUDFLARE_API_TOKEN }}
      - name: Verify renderer is enabled and healthy
        run: |
          curl --fail --silent --show-error https://ai-shengyi-video-factory.bitman001.workers.dev/api/health \
            | node -e "const fs=require('node:fs');const body=JSON.parse(fs.readFileSync(0,'utf8'));if(body?.renderer?.enabled!==true)throw new Error('rendererEnabled is not true');console.log('rendererEnabled=true')"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' https://ai-shengyi-video-factory.bitman001.workers.dev/api/renderer/health)" = "401"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors --max-time 45 \
            --header "X-Factory-Key: ${FACTORY_ADMIN_TOKEN}" \
            https://ai-shengyi-video-factory.bitman001.workers.dev/api/renderer/health \
            | node -e "const fs=require('node:fs');const body=JSON.parse(fs.readFileSync(0,'utf8'));if(body?.ok!==true||body?.renderer?.ok!==true||body?.renderer?.service!=='video-renderer')throw new Error('renderer health check failed');console.log('renderer health=ok')"
        env:
          FACTORY_ADMIN_TOKEN: ${{ secrets.VIDEO_FACTORY_ADMIN_TOKEN }}
