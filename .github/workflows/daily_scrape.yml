name: 每日项目采集

on:
  schedule:
    - cron: '17 0 * * *'  # 错开 GitHub 高峰；北京时间 08:17
    - cron: '43 12 * * *' # 独立补偿运行；北京时间 20:43
  workflow_dispatch:        # 允许手动触发

concurrency:
  group: daily-project-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write       # 赋予 commit 和 push 写入权限
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 openai

      - name: Test ingestion safeguards
        run: python3 -m unittest discover -s tests -p 'test_ingestion.py' -v

      - name: Run scraper
        env:
          CLOUDFLARE_EDITORIAL_ENDPOINT: https://ai-shengyi-jing.pages.dev/api/editorial
          EDITORIAL_API_TOKEN: ${{ secrets.EDITORIAL_API_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cd pipeline
          python3 scraper.py

      - name: Generate case pages for new projects
        run: |
          python3 scripts/generate_case_catalog.py \
            --missing-only \
            --fetch-media \
            --workers 2 \
            --request-interval 0.65 \
            --request-retries 2
          python3 scripts/validate_data.py data/projects_live.json
          python3 scripts/validate_case_catalog.py

      - name: Commit new data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/ pipeline/data/seen_ids.json pipeline/data/scrape_health.json pipeline/data/case_catalog_report.json pipeline/drafts/
          git diff --quiet && git diff --staged --quiet || git commit -m "📊 自动更新：$(date '+%Y-%m-%d') 项目数据"
          if git diff --quiet HEAD origin/main; then
            echo "No new project data to push"
          else
            git pull --rebase origin main
            git push origin main
          fi

      - name: Write run summary
        if: always()
        env:
          RUN_STATUS: ${{ job.status }}
        run: |
          echo "## Daily collection: $RUN_STATUS" >> "$GITHUB_STEP_SUMMARY"
          for report in pipeline/data/scrape_health.json pipeline/data/case_catalog_report.json; do
            if [ -f "$report" ]; then
              echo "### $report (check the report timestamp)" >> "$GITHUB_STEP_SUMMARY"
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Preserve failed collection for diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-collection-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: |
            pipeline/data/scrape_health.json
            pipeline/data/case_catalog_report.json
            data/projects_live.json
            data/case_articles/
