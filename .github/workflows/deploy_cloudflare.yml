name: 自动部署到 Cloudflare 与 EdgeOne

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "case.html"
      - "assets/**"
      - "data/**"
      - "functions/**"
      - "edge-functions/**"
      - "tests/advisor_function.test.mjs"
      - "tests/edgeone_proxy.test.mjs"
      - "package.json"
      - "wrangler.jsonc"
      - "scripts/build_site.py"
      - "scripts/build_edgeone.py"
      - "scripts/validate_data.py"
      - ".github/workflows/deploy_cloudflare.yml"
  workflow_run:
    workflows:
      - 每日项目采集
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: dual-pages-ai-shengyi-jing
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run.head_sha is the commit that started the scraper, not
          # the data commit pushed at the end, so always deploy current main.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Validate project database
        run: python3 scripts/validate_data.py data/projects_live.json

      - name: Test AI advisor function
        run: node --test tests/*.mjs

      - name: Build shared static artifact once
        run: python3 scripts/build_site.py --output dist --commit-sha "$(git rev-parse HEAD)"

      - name: Wrap shared artifact for EdgeOne
        run: python3 scripts/build_edgeone.py --source dist --output dist-edgeone

      - name: Build Pages Functions
        run: npx --yes wrangler@4.113.0 pages functions build functions --outdir .wrangler/functions-build --project-directory . --build-output-directory dist

      - name: Resolve deployment branch
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "DEPLOY_BRANCH=main" >> "$GITHUB_ENV"
          else
            echo "DEPLOY_BRANCH=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Validate deployment credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is missing or unavailable"
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Repository variable CLOUDFLARE_ACCOUNT_ID is missing"
            exit 1
          fi
          if [[ -z "$EDGEONE_API_TOKEN" ]]; then
            echo "::error::Repository secret EDGEONE_API_TOKEN is missing or unavailable"
            exit 1
          fi

      - name: Deploy to Cloudflare Pages via Wrangler
        uses: cloudflare/wrangler-action@v3
        env:
          # Keep the standard Wrangler environment variables as a fallback for
          # action/runtime combinations that do not forward inputs correctly.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.113.0"
          command: pages deploy --branch=${{ env.DEPLOY_BRANCH }} --commit-dirty=true

      - name: Deploy the same static artifact to EdgeOne Makers
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: >-
          npx --yes edgeone@1.6.18 makers deploy dist-edgeone
          --name ai-shengyi-jing-cn
          --env production
          --area overseas
          --token "$EDGEONE_API_TOKEN"
          --json
