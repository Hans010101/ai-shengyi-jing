name: 代码与数据检查

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install pipeline test dependencies
        run: pip install requests beautifulsoup4

      - name: Validate project database
        run: python3 scripts/validate_data.py data/projects_live.json

      - name: Validate complete case catalog
        run: python3 scripts/validate_case_catalog.py

      - name: Run maintenance tests
        run: python3 -m unittest discover -s tests -v

      - name: Test AI advisor function
        run: node --test tests/*.mjs

      - name: Build public artifact
        run: python3 scripts/build_site.py --output dist --commit-sha "$(git rev-parse HEAD)"

      - name: Build EdgeOne artifact
        run: python3 scripts/build_edgeone.py --source dist --output dist-edgeone

      - name: Build Pages Functions
        run: npx --yes wrangler@4.113.0 pages functions build functions --outdir .wrangler/functions-build --project-directory . --build-output-directory dist

      - name: Verify publish boundary
        shell: bash
        run: |
          PROJECT_COUNT="$(python3 -c "import json; print(len(json.load(open('data/projects_live.json'))))")"
          test "$(find dist -type f | wc -l | tr -d ' ')" = "$((PROJECT_COUNT + 10))"
          test "$(find dist-edgeone -type f | wc -l | tr -d ' ')" = "$((PROJECT_COUNT + 11))"
          test ! -e dist/.github
          test ! -e dist/.wrangler
          test ! -e dist/pipeline
          test ! -e dist/edge-functions
          test -f dist-edgeone/edge-functions/api/advisor.js
          cmp dist/deployment.json dist-edgeone/deployment.json
          cmp dist/data/projects_live.json dist-edgeone/data/projects_live.json
          cmp dist/data/case_articles.json dist-edgeone/data/case_articles.json
          diff -qr dist/data/case_articles dist-edgeone/data/case_articles
