name: 代码与数据检查

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install pipeline test dependencies
        run: pip install requests beautifulsoup4

      - name: Validate project database
        run: python3 scripts/validate_data.py data/projects_live.json

      - name: Run maintenance tests
        run: python3 -m unittest discover -s tests -v

      - name: Test AI advisor function
        run: node --test tests/*.mjs

      - name: Build public artifact
        run: python3 scripts/build_site.py --output dist

      - name: Build Pages Functions
        run: npx --yes wrangler@4.113.0 pages functions build functions --outdir .wrangler/functions-build --project-directory . --build-output-directory dist

      - name: Verify publish boundary
        shell: bash
        run: |
          test "$(find dist -type f | wc -l | tr -d ' ')" = "9"
          test ! -e dist/.github
          test ! -e dist/.wrangler
          test ! -e dist/pipeline
