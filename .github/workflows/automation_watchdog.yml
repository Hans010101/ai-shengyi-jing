name: 案例更新自动巡检与恢复

on:
  workflow_dispatch: # 与采集任务一起改为仅手动运行，避免自动恢复并再次消耗模型额度。

concurrency:
  group: case-update-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-check dependencies
        run: pip install requests beautifulsoup4
      - name: Check freshness, recover failures and verify live cases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_automation.py --repair
